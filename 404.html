<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex">
    <meta name="description" content="Səhifə tapılmadı — Aqil.lol">
    <title>404 — Səhifə tapılmadı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/404.css">
</head>
<body>
    <div class="nf-backdrop" aria-hidden="true">
        <canvas class="nf-warp"></canvas>
        <div class="nf-glow nf-glow--a"></div>
        <div class="nf-glow nf-glow--b"></div>
        <div class="nf-floor"><div class="nf-floor-plane"></div></div>
        <div class="nf-scan"></div>
        <div class="nf-vignette"></div>
    </div>

    <header class="nf-top">
        <a class="nf-brand" href="/">Aqil<span>.lol</span></a>
        <div class="nf-chips">
            <span class="nf-chip"><span class="nf-dot"></span>Siqnal itib</span>
            <span class="nf-chip nf-chip--mono" data-clock>--:--:--</span>
        </div>
    </header>

    <main class="nf-main">
        <section class="nf-hero" aria-labelledby="nf-title">
            <div class="nf-orbit" aria-hidden="true">
                <span class="nf-ring nf-ring--1"></span>
                <span class="nf-ring nf-ring--2"></span>
                <span class="nf-ring nf-ring--3"></span>
                <span class="nf-satellite"></span>
            </div>

            <p class="nf-eyebrow">Xəta kodu</p>
            <h1 id="nf-title" class="nf-code" data-text="404">404</h1>
            <h2 class="nf-heading">Bu koordinatda heç nə yoxdur</h2>
            <p class="nf-lead">Axtardığın səhifə ya silinib, ya köçürülüb, ya da heç vaxt mövcud olmayıb.</p>

            <div class="nf-actions">
                <a class="nf-btn nf-btn--primary" href="/">
                    <span>Ana səhifəyə qayıt</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
                <button class="nf-btn nf-btn--ghost" type="button" data-back>Geri qayıt</button>
            </div>
        </section>

        <section class="nf-panel" aria-label="Sistem məlumatı">
            <div class="nf-panel-bar">
                <span class="nf-light"></span><span class="nf-light"></span><span class="nf-light"></span>
                <span class="nf-panel-title">diagnostika</span>
            </div>
            <div class="nf-terminal" data-terminal aria-live="polite"></div>
            <div class="nf-redirect">
                <div class="nf-progress" role="progressbar" aria-label="Avtomatik yönləndirmə" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <span class="nf-progress-fill" data-progress></span>
                </div>
                <div class="nf-redirect-row">
                    <span data-redirect-label>Ana səhifəyə <b data-seconds>15</b> saniyəyə yönləndiriləcək</span>
                    <button class="nf-link" type="button" data-cancel>Dayandır</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="nf-footer">
        <span>&copy; 2026 Aqil.lol</span>
    </footer>

    <script src="/404.js" defer></script>
</body>
</html>
